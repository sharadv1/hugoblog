{{ define "main" }}
<!-- Tag filter indicator -->
<div class="tag-filter-indicator" id="tagFilterIndicator">
  <span class="tag-filter-label">Filtering by:</span>
  <span class="tag-filter-name" id="tagFilterName"></span>
  <button class="tag-filter-close" onclick="clearTagFilter()" aria-label="Clear filter">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>

<div class="posts-container">
  {{ range (where .Site.RegularPages "Section" "posts").ByDate.Reverse }}
    {{ partial "post-card.html" . }}
  {{ end }}
</div>
{{ end }}
